name: Sync taxonomy → Confluence

on:
  push:
    branches: [main]
    paths:
      - scripts/taxonomy.json
      - scripts/taxonomy_confluence_sync.py
      - .github/workflows/taxonomy-confluence.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar página no Confluence
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: python3 scripts/taxonomy_confluence_sync.py
