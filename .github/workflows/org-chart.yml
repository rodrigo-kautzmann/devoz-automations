name: org-chart

on:
  schedule:
    - cron: "30 8 * * *"   # 05:30 BRT, logo após o directory-sync
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gerar o PNG (artifact), sem publicar no Confluence"
        type: boolean
        default: true

jobs:
  org:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt
      - name: Gerar organograma
        env:
          FEEDZ_API_TOKEN: ${{ secrets.FEEDZ_API_TOKEN }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/org_chart.py
      - name: Publicar PNG como artifact
        uses: actions/upload-artifact@v4
        with:
          name: organograma
          path: organograma.png
